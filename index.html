<div id="start"><div class="panel"><h1>OFFROAD <em>EXTREME</em></h1><p>رانندگی آفرود سه‌بعدی در مسیر کوهستانی</p><p>برای چرخاندن دوربین، صفحه را با یک انگشت بکش. با دو انگشت زوم کن. دکمه VIEW زاویه‌های آماده را عوض می‌کند.</p><button id="play">START ENGINE</button></div></div>

const state={x:0,z:4,yaw:0,speed:0,steer:0,started:false,elapsed:0,score:0,finished:false},keys={left:false,right:false,gas:false,reverse:false,brake:false};
document.querySelectorAll('[data-control]').forEach(b=>{let k=b.dataset.control;const down=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')},up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,up))});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s')keys.reverse=true;if(e.key===' ')keys.brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s')keys.reverse=false;if(e.key===' ')keys.brake=false});
const $=s=>document.querySelector(s);function message(t){$('#message').textContent=t;$('#message').style.opacity=1;clearTimeout(message.timer);message.timer=setTimeout(()=>$('#message').style.opacity=0,1500)}

let camYaw=0,camPitch=.28,camDistance=10,view=0;const presets=[['REAR',0,.28,10],['FRONT',Math.PI,.2,10],['TOP',0,1.12,13],['SIDE',Math.PI/2,.22,10]];
function setView(i){view=(i+presets.length)%presets.length;let p=presets[view];camYaw=p[1];camPitch=p[2];camDistance=p[3];$('#viewBtn').textContent='VIEW: '+p[0]}$('#viewBtn').onclick=()=>setView(view+1);
let dragging=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.pointerType==='mouse'){dragging=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(dragging!==e.pointerId)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;camYaw-=dx*.008;camPitch=THREE.MathUtils.clamp(camPitch-dy*.006,-.12,1.35)});function endDrag(e){if(dragging===e.pointerId)dragging=null}renderer.domElement.addEventListener('pointerup',endDrag);renderer.domElement.addEventListener('pointercancel',endDrag);
