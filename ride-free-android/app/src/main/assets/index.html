<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RIDE FREE 3D</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #000}
#brand{position:absolute;top:14px;left:16px;font-weight:900;font-size:18px;letter-spacing:2px;color:#fff}
#stats{position:absolute;top:14px;right:16px;text-align:right;font-weight:bold;font-size:15px}
#speed{font-size:28px;color:#ffcf33}
#hint{position:absolute;top:62px;left:16px;font-size:11px;opacity:.8}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.cluster{display:flex;gap:12px;align-items:end}
.ctrl{pointer-events:auto;border:2px solid #ffffff88;background:#101c2ccc;color:white;border-radius:18px;width:72px;height:66px;font-size:13px;font-weight:bold;box-shadow:0 5px 18px #0008;touch-action:none}
.ctrl.big{width:88px;height:78px;background:#e84b24dd}.ctrl.active{background:#ffbd22;color:#111}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}#loadModel{position:absolute;top:54px;right:14px;pointer-events:auto;border:1px solid #ffffff88;border-radius:12px;padding:10px 13px;background:#14283ddd;color:white;font-weight:bold;font-size:12px}#modelFile{display:none}
#start{pointer-events:auto;border:0;border-radius:30px;padding:15px 32px;background:#ffbd22;color:#111;font-weight:900;font-size:17px;box-shadow:0 6px 24px #0008}
#message{font-size:12px;margin-top:10px}
@media(max-height:430px){.ctrl{height:58px;width:64px}.ctrl.big{height:68px;width:78px}#brand{font-size:15px}}
</style></head><body>
<div id="game"></div><div id="hud"><div id="brand">RIDE FREE <span style="color:#ffbd22">3D</span></div>
<div id="hint">DESERT RUN • FREE RIDE</div><button id="loadModel">LOAD MY MOTORCYCLE</button><input id="modelFile" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"><div id="stats"><div id="speed">0 <small>KM/H</small></div><div id="distance">DIST 0 M</div><div id="score">SCORE 0</div></div>
<div id="center"><button id="start">START RIDE</button><div id="message">DRAG SCREEN TO ROTATE CAMERA • Hold GAS</div></div></div>
<div id="controls"><div class="cluster"><button class="ctrl" id="left">◀ LEFT</button><button class="ctrl" id="right">RIGHT ▶</button></div><div class="cluster"><button class="ctrl" id="brake">BRAKE</button><button class="ctrl big" id="gas">GAS</button></div></div>
<script type="module">
// Load the 3D engine from two independent CDNs. A clear recovery screen is shown if both are unreachable.
const loadStatus=document.createElement('div');
loadStatus.style.cssText='position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#07111b;color:white;font: bold 16px Arial;text-align:center;padding:24px';
loadStatus.textContent='LOADING 3D ENGINE…';
document.body.appendChild(loadStatus);
let THREE, GLTFLoader;
try {
  try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }
  catch (firstError) { THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js'); }
  try { ({GLTFLoader} = await import('three/addons/loaders/GLTFLoader.js')); }
  catch (loaderError) { ({GLTFLoader} = await import('three/addons/loaders/GLTFLoader.js')); }
  loadStatus.remove();
} catch (error) {
  loadStatus.innerHTML='3D ENGINE COULD NOT LOAD.<br><br>Connect to the internet and tap Reload.';
  const retry=document.createElement('button');
  retry.textContent='RELOAD';
  retry.style.cssText='margin-top:18px;padding:14px 28px;border:0;border-radius:24px;background:#ffbd22;font-weight:bold';
  retry.onclick=()=>location.reload();
  loadStatus.appendChild(retry);
  throw error;
}
const root=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8b879);scene.fog=new THREE.Fog(0xe8b879,65,210);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',precision:'mediump'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.0));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe6c2,0x80603c,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-25,45,25);sun.castShadow=false;scene.add(sun);
const mat=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x4b4540),white=mat(0xf4e8d4),yellow=mat(0xe9b94d),sand=mat(0xc69a62),rock=mat(0x96704c),red=mat(0xe52e28,.35,.45),black=mat(0x11151a,.55,.25),chrome=mat(0xb9c5ca,.25,.8);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),sand);ground.rotation.x=-Math.PI/2;ground.position.y=-.16;scene.add(ground);
// Optimized low-poly desert scenery using instanced meshes.
const duneGeo=new THREE.SphereGeometry(1,8,5),duneMat=mat(0xd5aa70);
const dunes=new THREE.InstancedMesh(duneGeo,duneMat,26);const dummy=new THREE.Object3D();
for(let i=0;i<26;i++){const side=i%2?1:-1;dummy.position.set(side*(13+Math.random()*35),-1.3-Math.random()*1.4,-12-i*14);dummy.rotation.set(0,Math.random()*Math.PI,0);dummy.scale.set(7+Math.random()*12,2.5+Math.random()*4,10+Math.random()*13);dummy.updateMatrix();dunes.setMatrixAt(i,dummy.matrix)}scene.add(dunes);
const mesaGeo=new THREE.CylinderGeometry(3.5,7,1,5,1),mesaMat=mat(0x9b744e);
const mesas=new THREE.InstancedMesh(mesaGeo,mesaMat,16);
for(let i=0;i<16;i++){const side=i%2?1:-1;dummy.position.set(side*(22+Math.random()*45),2+Math.random()*5,-25-i*23);dummy.rotation.y=Math.random()*Math.PI;dummy.scale.set(1+Math.random()*1.5,5+Math.random()*12,1+Math.random()*1.5);dummy.updateMatrix();mesas.setMatrixAt(i,dummy.matrix)}scene.add(mesas);
const stoneGeo=new THREE.DodecahedronGeometry(1,0),stoneMat=mat(0x806247);
const stones=new THREE.InstancedMesh(stoneGeo,stoneMat,42);
for(let i=0;i<42;i++){const side=i%2?1:-1;dummy.position.set(side*(7+Math.random()*13),-.05+Math.random()*.3,-Math.random()*350);dummy.rotation.set(Math.random(),Math.random()*3,Math.random());dummy.scale.set(.35+Math.random()*1.1,.25+Math.random()*.65,.35+Math.random()*1.1);dummy.updateMatrix();stones.setMatrixAt(i,dummy.matrix)}scene.add(stones);
// Sparse cactus silhouettes in three draw calls.
const cactusMat=mat(0x47734b),trunkGeo=new THREE.CylinderGeometry(.13,.18,2.8,6),armGeo=new THREE.CylinderGeometry(.09,.11,1.05,6);
const trunks=new THREE.InstancedMesh(trunkGeo,cactusMat,9),arms=new THREE.InstancedMesh(armGeo,cactusMat,18);
for(let i=0;i<9;i++){const side=i%2?1:-1,x=side*(8+Math.random()*13),z=-18-i*39;dummy.position.set(x,1.25,z);dummy.rotation.set(0,Math.random()*Math.PI,0);dummy.scale.setScalar(.75+Math.random()*.45);dummy.updateMatrix();trunks.setMatrixAt(i,dummy.matrix);for(let a=0;a<2;a++){dummy.position.set(x+(a?-.34:.34),a?1.05:.78,z);dummy.rotation.set(0,0,Math.PI/2);dummy.scale.set(.85,.85,.85);dummy.updateMatrix();arms.setMatrixAt(i*2+a,dummy.matrix)}}scene.add(trunks,arms);
const road=new THREE.Mesh(new THREE.PlaneGeometry(13,360),asphalt);road.rotation.x=-Math.PI/2;road.position.set(0,-.12,-120);scene.add(road);
for(let x of [-6.25,6.25]){const line=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,360),white);line.position.set(x,-.09,-120);scene.add(line)}
const dashes=[];for(let z=25;z>-300;z-=10){let o=new THREE.Mesh(new THREE.BoxGeometry(.16,.03,4.5),yellow);o.position.set(0,-.075,z);scene.add(o);dashes.push(o)}
// Procedural sport motorcycle
const bike=new THREE.Group();scene.add(bike);const riderModel=new THREE.Group();scene.add(riderModel);riderModel.visible=false;
const modelPicker=document.getElementById('modelFile');document.getElementById('loadModel').onclick=()=>modelPicker.click();modelPicker.addEventListener('change',async()=>{const file=modelPicker.files&&modelPicker.files[0];if(!file)return;document.getElementById('message').textContent='LOADING 3D MOTORCYCLE...';try{const buffer=await file.arrayBuffer();new GLTFLoader().parse(buffer,'',gltf=>{const model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;o.frustumCulled=true}});riderModel.clear();riderModel.add(model);riderModel.scale.setScalar(1.27);riderModel.rotation.y=-Math.PI/2;riderModel.visible=true;bike.visible=false;document.getElementById('message').textContent='CUSTOM MOTORCYCLE LOADED';document.getElementById('center').style.display='none';},err=>{document.getElementById('message').textContent='MODEL LOAD FAILED';alert('Could not load this GLB model.');});}catch(err){document.getElementById('message').textContent='MODEL LOAD FAILED';alert('Could not read this model file.');}});
function box(parent,x,y,z,sx,sy,sz,material){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);o.position.set(x,y,z);o.castShadow=false;parent.add(o);return o}
function cyl(parent,x,y,z,r,h,material,rotZ=0){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),material);o.position.set(x,y,z);o.rotation.z=rotZ;o.castShadow=false;parent.add(o);return o}
function wheel(z){const g=new THREE.Group();g.position.set(0,.58,z);bike.add(g);const tire=new THREE.Mesh(new THREE.TorusGeometry(.49,.12,12,28),black);tire.rotation.y=Math.PI/2;g.add(tire);const rim=new THREE.Mesh(new THREE.TorusGeometry(.34,.035,8,24),chrome);rim.rotation.y=Math.PI/2;g.add(rim);cyl(g,0,0,0,.09,.2,chrome,Math.PI/2);for(let i=0;i<8;i++){let a=i*Math.PI/4;let sp=new THREE.Mesh(new THREE.BoxGeometry(.025,.66,.025),chrome);sp.rotation.z=a;sp.rotation.y=Math.PI/2;g.add(sp)}return g}
const rear=wheel(.9),front=wheel(-1.05);
box(bike,0,1.15,.35,.72,.38,red);box(bike,0,1.38,.02,.58,.2,black);box(bike,0,1.05,-.45,.5,.25,red);
const tank=new THREE.Mesh(new THREE.SphereGeometry(.42,20,14),red);tank.scale.set(.85,.65,1.35);tank.position.set(0,1.43,-.28);bike.add(tank);
box(bike,0,1.03,-.95,.18,.48,black);box(bike,0,1.64,-1.12,.55,.08,chrome);
const fork1=cyl(bike,-.22,.95,-1.03,.055,.9,chrome,.18),fork2=cyl(bike,.22,.95,-1.03,.055,.9,chrome,.18);
box(bike,0,1.88,-1.13,.65,.07,black);box(bike,0,1.18,1.0,.65,.12,chrome);
const rider=new THREE.Group();bike.add(rider);box(rider,0,1.95,.15,.48,.65,black);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.28,18,14),mat(0xffd23f,.3,.2));helmet.position.set(0,2.42,-.18);rider.add(helmet);
const obstacles=[];function makeCar(z,lane){const g=new THREE.Group();g.position.set(lane,0,z);box(g,0,.55,0,1.65,.8,2.7,red);box(g,0,1.05,-.15,1.35,.55,1.25,mat(0x9ed9ed,.25));for(let x of [-.82,.82])for(let zz of [-.85,.85]){const w=new THREE.Mesh(new THREE.BoxGeometry(.22,.4,.48),black);w.position.set(x,.32,zz);g.add(w)}scene.add(g);obstacles.push(g)}
for(let i=0;i<8;i++)makeCar(-35-i*32,[-4,0,4][i%3]);
const mountains=[];for(let i=0;i<22;i++){let h=10+Math.random()*18;let m=new THREE.Mesh(new THREE.ConeGeometry(10+Math.random()*13,h,5),rock);m.position.set((i%2?1:-1)*(30+Math.random()*55),h/2-1,-i*18-20);scene.add(m);mountains.push(m)}
let speed=0,dist=0,score=0,lane=0,running=false,steer=0,wheelie=0;
const pressed={};function bind(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();pressed[key]=true;el.classList.add('active')});for(const ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>{pressed[key]=false;el.classList.remove('active')})}
bind('gas','gas');bind('brake','brake');bind('left','left');bind('right','right');
document.getElementById('start').onclick=()=>{running=true;document.getElementById('center').style.display='none';speed=35};
// Touch-drag orbit camera: horizontal drag rotates around the rider, vertical drag changes elevation.
let camYaw=.28,camPitch=.22,camDistance=8,dragging=false,lastTouchX=0,lastTouchY=0;
renderer.domElement.style.touchAction='none';
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastTouchX=e.clientX;lastTouchY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastTouchX,dy=e.clientY-lastTouchY;lastTouchX=e.clientX;lastTouchY=e.clientY;camYaw-=dx*.008;camPitch=Math.max(-.08,Math.min(.82,camPitch+dy*.006))});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;
if(running){if(pressed.gas)speed=Math.min(190,speed+48*dt);else speed=Math.max(38,speed-8*dt);if(pressed.brake)speed=Math.max(0,speed-95*dt);
if(pressed.left)lane=Math.max(-4.5,lane-7*dt);if(pressed.right)lane=Math.min(4.5,lane+7*dt);
bike.position.x+=(lane-bike.position.x)*Math.min(1,dt*6);bike.rotation.z+=( (pressed.left?.22:pressed.right?-.22:0)-bike.rotation.z)*dt*4;
wheelie=pressed.gas&&speed>90?.12:0;bike.rotation.x+=(wheelie-bike.rotation.x)*dt*2;
let move=speed*dt*.34;dist+=move;score+=Math.round(move*.2);
for(const d of dashes){d.position.z+=move;if(d.position.z>30)d.position.z-=330}
for(const c of obstacles){c.position.z+=move;if(c.position.z>12){c.position.z=-220-Math.random()*90;c.position.x=[-4,0,4][Math.floor(Math.random()*3)]}
if(Math.abs(c.position.z-bike.position.z)<1.9&&Math.abs(c.position.x-bike.position.x)<1.15){speed*=.91;score=Math.max(0,score-3)}}
for(const m of mountains){m.position.z+=move*.7;if(m.position.z>25)m.position.z-=420}
document.getElementById('speed').innerHTML=Math.round(speed)+' <small>KM/H</small>';document.getElementById('distance').textContent='DIST '+Math.floor(dist)+' M';document.getElementById('score').textContent='SCORE '+score;
}
bike.position.y=.02+Math.sin(now*.008)*.015;riderModel.position.set(bike.position.x,bike.position.y+.94,bike.position.z);riderModel.rotation.x=bike.rotation.x;riderModel.rotation.y=-Math.PI/2-bike.rotation.y;riderModel.rotation.z=bike.rotation.z;
const target=new THREE.Vector3(bike.position.x,1.05,bike.position.z-.35);const desired=new THREE.Vector3(target.x+Math.sin(camYaw)*camDistance,target.y+Math.sin(camPitch)*camDistance,target.z+Math.cos(camYaw)*camDistance);camera.position.lerp(desired,.16);camera.lookAt(target);
renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
